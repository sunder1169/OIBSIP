<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="converter">

            <h1>Temperature Converter</h1>

            <p class="description">
                Convert temperatures between
                Celsius, Fahrenheit and Kelvin.
            </p>


            <!-- Temperature Input -->

            <label for="temperature">
                Enter Temperature
            </label>

            <input
                type="number"
                id="temperature"
                placeholder="Enter temperature"
            >


            <!-- Unit Selection -->

            <label for="unit">
                Select Unit
            </label>

            <select id="unit">

                <option value="celsius">
                    Celsius
                </option>

                <option value="fahrenheit">
                    Fahrenheit
                </option>

                <option value="kelvin">
                    Kelvin
                </option>

            </select>


            <!-- Convert Button -->

            <button onclick="convertTemperature()">
                Convert
            </button>


            <!-- Result -->

            <div class="result">

                <h2>Result</h2>

                <p id="celsiusResult">
                    Celsius: -
                </p>

                <p id="fahrenheitResult">
                    Fahrenheit: -
                </p>

                <p id="kelvinResult">
                    Kelvin: -
                </p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
